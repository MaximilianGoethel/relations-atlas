<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relations Atlas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Relations Atlas</h1>
    <p class="hint">Click a country to open its panel. Scroll or pinch to zoom, drag to move.</p>
  </header>

  <main id="map-container">
    <svg id="map" role="img" aria-label="World map"></svg>
    <div id="tooltip" class="tooltip" hidden></div>
    <p id="map-status" class="map-status">Loading map…</p>

    <!-- Side panel, filled by app.js when a country is clicked -->
    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" type="button" aria-label="Close panel">&times;</button>
      <h2 id="panel-title" class="panel-title"></h2>
      <p class="panel-note">No data yet.</p>
    </aside>
  </main>

  <!-- Libraries from a CDN (no install needed) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
