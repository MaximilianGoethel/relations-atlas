<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relations Atlas</title>
  <!-- The ?v= number forces browsers to load the new file after a change: raise it with every update -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="site-header">
    <h1>Relations Atlas</h1>
    <p class="hint">Hover over a country to see its key relations, click it for details. Scroll or pinch to zoom, drag to move.</p>
  </header>

  <main class="layout">
    <div id="map-container" class="map-container">
      <svg id="map" role="img" aria-label="World map"></svg>
      <div id="tooltip" class="tooltip" hidden></div>
      <p id="map-status" class="map-status">Loading map…</p>
      <!-- Colour key for the arrows, filled by app.js -->
      <div id="legend" class="legend" hidden></div>
    </div>

    <!-- Side panel, filled by app.js when a country is clicked -->
    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" type="button" aria-label="Close panel">&times;</button>
      <button id="panel-back" class="panel-back" type="button" hidden></button>
      <h2 id="panel-title" class="panel-title"></h2>
      <p id="panel-note" class="panel-note"></p>
      <div id="panel-content"></div>
    </aside>
  </main>

  <!-- Libraries from a CDN (no install needed) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
